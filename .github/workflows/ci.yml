name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --settings .runsettings --results-directory artifacts/test-results

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.coverage
            !artifacts/test-results/**/In/**
